name: "CI - Tests"

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Source Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit

  process:
    name: Process Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:process:source

  browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zendev-lab/spark-hub run setup:browser
      - run: pnpm run test:browser:hub

  mutation:
    name: Focused Mutation Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mutation-relevant changes
        id: mutation_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          affected=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci-tests.yml|\
              packages/spark-extension/src/extension/*|\
              packages/spark-extension/stryker.config.json|\
              packages/spark-extension/vitest.mutation.config.ts|\
              packages/spark-tasks/src/*|\
              packages/spark-tasks/stryker.config.json|\
              packages/spark-tasks/vitest.mutation.config.ts|\
              packages/*/package.json|\
              packages/*/stryker.config.json)
                affected=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "affected=$affected" >> "$GITHUB_OUTPUT"

      - name: Skip focused mutation tests
        if: steps.mutation_changes.outputs.affected != 'true'
        run: echo "No mutation-relevant files changed."

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.mutation_changes.outputs.affected == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.mutation_changes.outputs.affected == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.mutation_changes.outputs.affected == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run focused mutation tests
        if: steps.mutation_changes.outputs.affected == 'true'
        run: >-
          pnpm --workspace-concurrency=1
          --filter @zendev-lab/spark-extension
          --filter @zendev-lab/spark-tasks
          run test:mutation

      - name: Upload mutation reports
        if: always() && steps.mutation_changes.outputs.affected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-ci-reports
          path: packages/*/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
