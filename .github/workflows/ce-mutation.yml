name: "CE - Mutation Tests"

on:
  schedule:
    # Mondays 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ce-mutation.yml"
      - "packages/spark-extension/src/extension/**"
      - "packages/spark-extension/stryker.config.json"
      - "packages/spark-extension/vitest.mutation.config.ts"
      - "packages/spark-tasks/src/**"
      - "packages/spark-tasks/stryker.config.json"
      - "packages/spark-tasks/vitest.mutation.config.ts"
      - "scripts/check-mutation-ce-ownership.mjs"
      - "scripts/run-leaf-mutation.mjs"
      - "test/mutation-ce-ownership.json"
      - "test/task-todo-store-atomic.test.ts"

concurrency:
  group: ce-mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-tests:
    name: mutation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate mutation ownership
        run: node scripts/check-mutation-ce-ownership.mjs

      - name: Run mutation tests
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm run test:mutation -- \
              @zendev-lab/spark-extension \
              @zendev-lab/spark-tasks
          else
            pnpm run test:mutation
          fi

      - name: Upload mutation CE reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-ce-reports
          path: |
            packages/spark-retry/reports/mutation/
            packages/spark-protocol/reports/mutation/
            packages/spark-cockpit-db/reports/mutation/
            packages/spark-system/reports/mutation/
            packages/spark-channels/reports/mutation/
            packages/spark-cockpit-coordination/reports/mutation/
            packages/spark-session/reports/mutation/
            packages/spark-artifacts/reports/mutation/
            packages/spark-repro/reports/mutation/
            packages/spark-i18n/reports/mutation/
            packages/spark-extension/reports/mutation/
            packages/spark-tasks/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
