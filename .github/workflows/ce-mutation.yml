name: "CE - Mutation Tests"

on:
  schedule:
    # Mondays 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ce-mutation.yml"
      - "packages/spark-extension/src/extension/**"
      - "packages/spark-extension/stryker.config.json"
      - "packages/spark-extension/vitest.mutation.config.ts"
      - "packages/spark-tasks/src/**"
      - "packages/spark-tasks/stryker.config.json"
      - "packages/spark-tasks/vitest.mutation.config.ts"
      - "packages/*/package.json"
      - "packages/*/stryker.config.json"
      - "packages/spark-tasks/src/todo-store.atomic.test.ts"

concurrency:
  group: ce-mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-tests:
    name: mutation-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run focused mutation tests
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          pnpm --workspace-concurrency=1
          --filter @zendev-lab/spark-extension
          --filter @zendev-lab/spark-tasks
          run test:mutation

      - name: Run full mutation CE
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm run test:mutation

      - name: Upload mutation CE reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-ce-reports
          path: packages/*/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
