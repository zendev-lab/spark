name: "CI - Mutation Tests"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci-mutation.yml"
      - "apps/spark-daemon/src/product/policy/**"
      - "apps/spark-daemon/stryker.config.json"
      - "apps/spark-daemon/vitest.mutation.config.ts"
      - "apps/spark-daemon/package.json"
      - "packages/spark-tasks/src/**"
      - "packages/spark-tasks/stryker.config.json"
      - "packages/spark-tasks/vitest.mutation.config.ts"
      - "packages/*/package.json"
      - "packages/*/stryker.config.json"

concurrency:
  group: ci-mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-tests:
    name: Focused Mutation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run focused mutation tests
        run: >-
          pnpm --workspace-concurrency=1
          --filter @zendev-lab/spark-daemon
          --filter @zendev-lab/spark-tasks
          run test:mutation

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-ci-reports
          path: |
            apps/*/reports/mutation/
            packages/*/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
