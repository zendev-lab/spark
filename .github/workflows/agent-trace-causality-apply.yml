name: TEMP - Apply Agent Trace Causality Contract

on:
  push:
    branches:
      - agent/agent-observability-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply causal trace contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          function replaceOnce(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`${label} source block not found`);
            return source.replace(from, to);
          }

          const schemaPath = "packages/spark-protocol/src/agent-trace-schema.ts";
          let schema = readFileSync(schemaPath, "utf8");
          schema = replaceOnce(
            schema,
            '  "skill.routing.finished",\n',
            '  "skill.routing.started",\n  "skill.routing.finished",\n',
            "routing event kinds",
          );
          schema = replaceOnce(
            schema,
            'export const sparkAgentSkillRoutingModeSchema = z.enum(SPARK_AGENT_SKILL_ROUTING_MODES);\n\n',
            `export const sparkAgentSkillRoutingModeSchema = z.enum(SPARK_AGENT_SKILL_ROUTING_MODES);\n\nexport const SPARK_AGENT_SKILL_ROUTING_STATUSES = ["succeeded", "failed"] as const;\n\nexport const sparkAgentSkillRoutingStatusSchema = z.enum(SPARK_AGENT_SKILL_ROUTING_STATUSES);\n\nexport const SPARK_AGENT_SKILL_ROUTING_FAILURE_TYPES = [\n  "catalog_read_failed",\n  "uncaught_exception",\n  "unknown",\n] as const;\n\nexport const sparkAgentSkillRoutingFailureTypeSchema = z.enum(\n  SPARK_AGENT_SKILL_ROUTING_FAILURE_TYPES,\n);\n\n`,
            "routing status schemas",
          );
          schema = replaceOnce(
            schema,
            `const modelSchema = z\n  .object({\n    provider: labelSchema,\n    id: labelSchema,\n    api: labelSchema.optional(),\n    reasoning: labelSchema.optional(),\n  })\n  .strict();\n\n`,
            `const modelSchema = z\n  .object({\n    provider: labelSchema,\n    id: labelSchema,\n    api: labelSchema.optional(),\n    reasoning: labelSchema.optional(),\n  })\n  .strict();\n\nexport const sparkAgentModelToolCallSchema = z\n  .object({\n    id: idSchema,\n    name: labelSchema,\n  })\n  .strict();\n\n`,
            "model Tool-call summary schema",
          );
          schema = replaceOnce(
            schema,
            '    cacheWriteTokens: z.number().int().nonnegative().optional(),\n    errorCode: labelSchema.optional(),\n',
            '    cacheWriteTokens: z.number().int().nonnegative().optional(),\n    toolCalls: z.array(sparkAgentModelToolCallSchema).default([]),\n    errorCode: labelSchema.optional(),\n',
            "model finish Tool calls",
          );
          schema = replaceOnce(
            schema,
            `    if (event.outcome === "completed" && event.errorCode !== undefined) {\n      context.addIssue({\n        code: "custom",\n        path: ["errorCode"],\n        message: "completed roundtrips cannot carry errorCode",\n      });\n    }\n  });\n\nexport const sparkAgentSkillRoutingTraceEventSchema`,
            `    if (event.outcome === "completed" && event.errorCode !== undefined) {\n      context.addIssue({\n        code: "custom",\n        path: ["errorCode"],\n        message: "completed roundtrips cannot carry errorCode",\n      });\n    }\n    const toolCallIds = event.toolCalls.map((toolCall) => toolCall.id);\n    if (new Set(toolCallIds).size !== toolCallIds.length) {\n      context.addIssue({\n        code: "custom",\n        path: ["toolCalls"],\n        message: "model roundtrip Tool-call ids must be unique",\n      });\n    }\n  });\n\nexport const sparkAgentSkillRoutingTraceEventSchema`,
            "model Tool-call uniqueness",
          );
          const oldRouting = `export const sparkAgentSkillRoutingTraceEventSchema = childEventSchema\n  .extend({\n    kind: z.literal("skill.routing.finished"),\n    appliesFromRoundtrip: z.number().int().positive(),\n    mode: sparkAgentSkillRoutingModeSchema,\n    skills: z.array(sparkAgentTraceSkillSchema).max(64),\n    candidateCount: z.number().int().nonnegative().optional(),\n    selectorVersion: labelSchema.optional(),\n    routingFingerprint: fingerprintSchema.optional(),\n  })\n  .strict()\n  .superRefine((event, context) => {\n    const names = event.skills.map((skill) => skill.name);\n    if (new Set(names).size !== names.length) {\n      context.addIssue({\n        code: "custom",\n        path: ["skills"],\n        message: "selected Skill names must be unique",\n      });\n    }\n    if (event.mode === "none" && event.skills.length > 0) {\n      context.addIssue({\n        code: "custom",\n        path: ["skills"],\n        message: "selection mode none cannot contain Skills",\n      });\n    }\n    if (event.candidateCount !== undefined && event.candidateCount < event.skills.length) {\n      context.addIssue({\n        code: "custom",\n        path: ["candidateCount"],\n        message: "candidateCount cannot be smaller than selected Skills",\n      });\n    }\n  });\n\n`;
          const newRouting = `export const sparkAgentSkillRoutingStartedTraceEventSchema = childEventSchema\n  .extend({\n    kind: z.literal("skill.routing.started"),\n    appliesFromRoundtrip: z.number().int().positive(),\n    mode: sparkAgentSkillRoutingModeSchema,\n    selectorVersion: labelSchema.optional(),\n  })\n  .strict();\n\nexport const sparkAgentSkillRoutingFinishedTraceEventSchema = childEventSchema\n  .extend({\n    kind: z.literal("skill.routing.finished"),\n    appliesFromRoundtrip: z.number().int().positive(),\n    mode: sparkAgentSkillRoutingModeSchema,\n    selectorVersion: labelSchema.optional(),\n    status: sparkAgentSkillRoutingStatusSchema,\n    durationMs: z.number().int().nonnegative(),\n    skills: z.array(sparkAgentTraceSkillSchema).max(64),\n    candidateCount: z.number().int().nonnegative().optional(),\n    routingFingerprint: fingerprintSchema.optional(),\n    failureType: sparkAgentSkillRoutingFailureTypeSchema.optional(),\n    errorCode: labelSchema.optional(),\n  })\n  .strict()\n  .superRefine((event, context) => {\n    if (event.status === "failed") {\n      if (event.failureType === undefined) {\n        context.addIssue({\n          code: "custom",\n          path: ["failureType"],\n          message: "failed Skill routing requires failureType",\n        });\n      }\n      if (event.skills.length > 0) {\n        context.addIssue({\n          code: "custom",\n          path: ["skills"],\n          message: "failed Skill routing cannot claim routed Skills",\n        });\n      }\n      return;\n    }\n\n    if (event.failureType !== undefined || event.errorCode !== undefined) {\n      context.addIssue({\n        code: "custom",\n        message: "succeeded Skill routing cannot carry failure fields",\n      });\n    }\n    const names = event.skills.map((skill) => skill.name);\n    if (new Set(names).size !== names.length) {\n      context.addIssue({\n        code: "custom",\n        path: ["skills"],\n        message: "routed Skill names must be unique",\n      });\n    }\n    if (event.mode === "none" && event.skills.length > 0) {\n      context.addIssue({\n        code: "custom",\n        path: ["skills"],\n        message: "routing mode none cannot contain Skills",\n      });\n    }\n    if (event.candidateCount !== undefined && event.candidateCount < event.skills.length) {\n      context.addIssue({\n        code: "custom",\n        path: ["candidateCount"],\n        message: "candidateCount cannot be smaller than routed Skills",\n      });\n    }\n  });\n\n`;
          schema = replaceOnce(schema, oldRouting, newRouting, "routing lifecycle block");
          schema = replaceOnce(
            schema,
            `  sparkAgentModelRoundtripFinishedTraceEventSchema,\n  sparkAgentSkillRoutingTraceEventSchema,\n  sparkAgentSkillLoadStartedTraceEventSchema,\n`,
            `  sparkAgentModelRoundtripFinishedTraceEventSchema,\n  sparkAgentSkillRoutingStartedTraceEventSchema,\n  sparkAgentSkillRoutingFinishedTraceEventSchema,\n  sparkAgentSkillLoadStartedTraceEventSchema,\n`,
            "trace union routing entries",
          );
          schema = replaceOnce(
            schema,
            `export type SparkAgentSkillRoutingMode = z.infer<typeof sparkAgentSkillRoutingModeSchema>;\nexport type SparkAgentSkillLoadStatus`,
            `export type SparkAgentSkillRoutingMode = z.infer<typeof sparkAgentSkillRoutingModeSchema>;\nexport type SparkAgentSkillRoutingStatus = z.infer<typeof sparkAgentSkillRoutingStatusSchema>;\nexport type SparkAgentSkillRoutingFailureType = z.infer<\n  typeof sparkAgentSkillRoutingFailureTypeSchema\n>;\nexport type SparkAgentModelToolCall = z.infer<typeof sparkAgentModelToolCallSchema>;\nexport type SparkAgentSkillLoadStatus`,
            "routing exported types",
          );
          writeFileSync(schemaPath, schema);

          const validationPath = "packages/spark-protocol/src/agent-trace-validation.ts";
          let validation = readFileSync(validationPath, "utf8");
          validation = replaceOnce(
            validation,
            `type RoundtripStartedEvent = Extract<SparkAgentTraceEvent, { kind: "model.roundtrip.started" }>;\ntype SkillLoadStartedEvent`,
            `type RoundtripStartedEvent = Extract<SparkAgentTraceEvent, { kind: "model.roundtrip.started" }>;\ntype RoundtripFinishedEvent = Extract<\n  SparkAgentTraceEvent,\n  { kind: "model.roundtrip.finished" }\n>;\ntype SkillRoutingStartedEvent = Extract<\n  SparkAgentTraceEvent,\n  { kind: "skill.routing.started" }\n>;\ntype SkillLoadStartedEvent`,
            "validation routing type aliases",
          );
          validation = replaceOnce(
            validation,
            `  | RunStartedEvent\n  | RoundtripStartedEvent\n  | SkillLoadStartedEvent`,
            `  | RunStartedEvent\n  | RoundtripStartedEvent\n  | SkillRoutingStartedEvent\n  | SkillLoadStartedEvent`,
            "started event union",
          );
          validation = replaceOnce(
            validation,
            `      | "model.roundtrip.finished"\n      | "skill.load.finished"`,
            `      | "model.roundtrip.finished"\n      | "skill.routing.finished"\n      | "skill.load.finished"`,
            "finished event union",
          );
          validation = validation.replace(
            `type ToolTraceEvent = Extract<\n  SparkAgentTraceEvent,\n  { kind: "tool.call.started" | "tool.call.finished" }\n>;\n\n`,
            "",
          );
          validation = replaceOnce(
            validation,
            '  | "model_origin_open";\n',
            '  | "model_origin_open"\n  | "model_origin_call_mismatch";\n',
            "causal issue code",
          );
          validation = validation.replace("  const instantSpanIds = new Set<string>();\n", "");
          validation = replaceOnce(
            validation,
            `  const roundtripSpans = new Map<number, OpenSpan>();\n`,
            `  const roundtripSpans = new Map<number, OpenSpan>();\n  const roundtripFinishes = new Map<string, RoundtripFinishedEvent>();\n`,
            "roundtrip finish map",
          );
          validation = validation.replace(
            "    if (spans.has(event.spanId) || instantSpanIds.has(event.spanId)) {",
            "    if (spans.has(event.spanId)) {",
          );
          validation = replaceOnce(
            validation,
            `    if (event.kind === "tool.call.started" || event.kind === "tool.call.finished") {\n      validateToolModelOrigin(event, eventIndex);\n    }\n`,
            `    if (event.kind === "tool.call.started") {\n      validateToolModelOrigin(event, eventIndex);\n    }\n`,
            "Tool origin validation dispatch",
          );
          validation = validation.replace(
            "function validateToolModelOrigin(event: ToolTraceEvent, eventIndex: number): void {",
            "function validateToolModelOrigin(event: ToolCallStartedEvent, eventIndex: number): void {",
          );
          validation = replaceOnce(
            validation,
            `    if (!origin.finished) {\n      issue(\n        "model_origin_open",\n        \`model origin span \${event.modelOrigin.spanId} must finish before Tool execution starts\`,\n        event,\n        eventIndex,\n      );\n    }\n`,
            `    if (!origin.finished) {\n      issue(\n        "model_origin_open",\n        \`model origin span \${event.modelOrigin.spanId} must finish before Tool execution starts\`,\n        event,\n        eventIndex,\n      );\n      return;\n    }\n\n    const originFinish = roundtripFinishes.get(event.modelOrigin.spanId);\n    const emitted = originFinish?.toolCalls.find(\n      (toolCall) => toolCall.id === event.toolCallId && toolCall.name === event.toolName,\n    );\n    if (!emitted) {\n      issue(\n        "model_origin_call_mismatch",\n        \`model origin span \${event.modelOrigin.spanId} did not emit Tool call \${event.toolCallId} (\${event.toolName})\`,\n        event,\n        eventIndex,\n      );\n    }\n`,
            "Tool origin emitted call check",
          );
          validation = replaceOnce(
            validation,
            `      case "model.roundtrip.started":\n        registerRoundtripStart(event, eventIndex);\n        return;\n      case "skill.load.started":\n      case "tool.call.started":\n        registerStart(event, eventIndex);\n        return;\n      case "skill.routing.finished":\n        registerInstantEvent(event, eventIndex);\n        return;\n`,
            `      case "model.roundtrip.started":\n        registerRoundtripStart(event, eventIndex);\n        return;\n      case "skill.routing.started":\n      case "skill.load.started":\n      case "tool.call.started":\n        registerStart(event, eventIndex);\n        return;\n`,
            "routing consume start",
          );
          validation = replaceOnce(
            validation,
            `      case "agent.run.finished":\n      case "model.roundtrip.finished":\n      case "skill.load.finished":\n`,
            `      case "agent.run.finished":\n      case "model.roundtrip.finished":\n      case "skill.routing.finished":\n      case "skill.load.finished":\n`,
            "routing consume finish",
          );
          const instantFunctionStart = validation.indexOf("  function registerInstantEvent(");
          if (instantFunctionStart === -1) throw new Error("instant routing function not found");
          const finishSpanStart = validation.indexOf("  function finishSpan(", instantFunctionStart);
          if (finishSpanStart === -1) throw new Error("finishSpan not found after instant routing function");
          validation = validation.slice(0, instantFunctionStart) + validation.slice(finishSpanStart);
          validation = replaceOnce(
            validation,
            `    if (event.kind === "model.roundtrip.finished" && activeRoundtripSpanId === event.spanId) {\n      activeRoundtripSpanId = undefined;\n    }\n`,
            `    if (event.kind === "model.roundtrip.finished") {\n      roundtripFinishes.set(event.spanId, event);\n      if (activeRoundtripSpanId === event.spanId) activeRoundtripSpanId = undefined;\n    }\n`,
            "record roundtrip finish",
          );
          validation = replaceOnce(
            validation,
            `    if (\n      started.kind === "skill.load.started" &&\n`,
            `    if (\n      started.kind === "skill.routing.started" &&\n      finished.kind === "skill.routing.finished" &&\n      !sameSkillRouting(started, finished)\n    ) {\n      issue(\n        "span_metadata_mismatch",\n        "Skill routing finish does not match start",\n        finished,\n        eventIndex,\n      );\n    }\n\n    if (\n      started.kind === "skill.load.started" &&\n`,
            "routing metadata validation",
          );
          validation = replaceOnce(
            validation,
            `    case "model.roundtrip.finished":\n    case "skill.routing.finished":\n`,
            `    case "model.roundtrip.finished":\n    case "skill.routing.started":\n    case "skill.routing.finished":\n`,
            "routing expected parent",
          );
          validation = replaceOnce(
            validation,
            `    case "model.roundtrip.finished":\n      return "model.roundtrip.started";\n    case "skill.load.finished":\n`,
            `    case "model.roundtrip.finished":\n      return "model.roundtrip.started";\n    case "skill.routing.finished":\n      return "skill.routing.started";\n    case "skill.load.finished":\n`,
            "routing expected start",
          );
          validation = replaceOnce(
            validation,
            `function sameSkillLoad(\n`,
            `function sameSkillRouting(\n  started: SkillRoutingStartedEvent,\n  finished: Extract<SparkAgentTraceEvent, { kind: "skill.routing.finished" }>,\n): boolean {\n  return (\n    started.parentSpanId === finished.parentSpanId &&\n    started.appliesFromRoundtrip === finished.appliesFromRoundtrip &&\n    started.mode === finished.mode &&\n    started.selectorVersion === finished.selectorVersion\n  );\n}\n\nfunction sameSkillLoad(\n`,
            "routing matcher",
          );
          writeFileSync(validationPath, validation);

          const testPath = "packages/spark-protocol/src/agent-tracing.test.ts";
          let test = readFileSync(testPath, "utf8");
          test = replaceOnce(
            test,
            `    inputTokens: 10,\n    outputTokens: 5,\n`,
            `    inputTokens: 10,\n    outputTokens: 5,\n    toolCalls: roundtrip === 1 ? [{ id: "call-1", name: "read_file" }] : [],\n`,
            "roundtrip Tool summary",
          );
          test = replaceOnce(
            test,
            `    parseEvent({\n      schemaVersion: 1,\n      eventId: "event:skills:routed",\n`,
            `    parseEvent({\n      schemaVersion: 1,\n      eventId: "event:skills:routing:start",\n      traceId: "invocation:123",\n      spanId: "skills:routing:1",\n      parentSpanId: "run:123",\n      occurredAt,\n      kind: "skill.routing.started",\n      appliesFromRoundtrip: 1,\n      mode: "automatic",\n      selectorVersion: "skill-router-v2",\n    }),\n    parseEvent({\n      schemaVersion: 1,\n      eventId: "event:skills:routed",\n`,
            "routing start fixture",
          );
          test = test.split('spanId: "skills:selection:1"').join('spanId: "skills:routing:1"');
          test = replaceOnce(
            test,
            `      selectorVersion: "skill-router-v2",\n      routingFingerprint: fingerprint,\n`,
            `      selectorVersion: "skill-router-v2",\n      status: "succeeded",\n      durationMs: 2,\n      routingFingerprint: fingerprint,\n`,
            "routing finish status",
          );
          test = test.split("metadata-only Skill selection").join("metadata-only Skill routing");
          test = test.split("routing selection").join("routing result");
          test = test.split("unique selected Skills").join("unique routed Skills");
          test = replaceOnce(
            test,
            `        kind: "skill.routing.finished",\n        appliesFromRoundtrip: 1,\n        mode: "automatic",\n        skills: [{ name: "github" }, { name: "github" }],\n`,
            `        kind: "skill.routing.finished",\n        appliesFromRoundtrip: 1,\n        mode: "automatic",\n        status: "succeeded",\n        durationMs: 1,\n        skills: [{ name: "github" }, { name: "github" }],\n`,
            "routing schema test status",
          );
          test = replaceOnce(
            test,
            `  it("detects orphan finishes and unclosed spans", () => {\n`,
            `  it("records failed Skill routing without claiming routed Skills", () => {\n    expect(\n      parseEvent({\n        schemaVersion: 1,\n        eventId: "event:routing:failed",\n        traceId: "invocation:123",\n        spanId: "routing:failed",\n        parentSpanId: "run:123",\n        occurredAt,\n        kind: "skill.routing.finished",\n        appliesFromRoundtrip: 1,\n        mode: "automatic",\n        status: "failed",\n        durationMs: 4,\n        skills: [],\n        failureType: "catalog_read_failed",\n      }).kind,\n    ).toBe("skill.routing.finished");\n  });\n\n  it("detects orphan finishes and unclosed spans", () => {\n`,
            "routing failure test",
          );
          test = replaceOnce(
            test,
            `    const openOrigin = completeTrace();\n`,
            `    const wrongCall = completeTrace();\n    const wrongStartIndex = wrongCall.findIndex((event) => event.kind === "tool.call.started");\n    const wrongFinishIndex = wrongCall.findIndex((event) => event.kind === "tool.call.finished");\n    wrongCall[wrongStartIndex] = parseEvent({\n      ...wrongCall[wrongStartIndex]!,\n      toolName: "write_file",\n    });\n    wrongCall[wrongFinishIndex] = parseEvent({\n      ...wrongCall[wrongFinishIndex]!,\n      toolName: "write_file",\n    });\n    expect(\n      validateCompletedSparkAgentTrace(wrongCall).issues.map((issue) => issue.code),\n    ).toContain("model_origin_call_mismatch");\n\n    const openOrigin = completeTrace();\n`,
            "origin emitted call test",
          );
          writeFileSync(testPath, test);

          const docsPath = "docs/specs/agent-tracing.md";
          let docs = readFileSync(docsPath, "utf8");
          docs = docs.split("Skill routing event").join("Skill routing span");
          docs = replaceOnce(
            docs,
            `Event:\n\n- \`skill.routing.finished\`\n`,
            `Events:\n\n- \`skill.routing.started\`\n- \`skill.routing.finished\`\n`,
            "routing events docs",
          );
          docs = replaceOnce(
            docs,
            `Selection records:\n\n- the roundtrip from which the routing context applies;\n- routing mode (\`explicit | automatic | inherited | none\`);\n- selected Skill identities;\n- optional candidate count, selector version, and routing fingerprint.\n\nRouted Skill names must be unique. \`mode: none\` cannot contain Skills.\n`,
            `Routing records:\n\n- the roundtrip from which the routing context applies;\n- routing mode (\`explicit | automatic | inherited | none\`);\n- selector version when available;\n- terminal status and duration;\n- routed Skill identities and optional candidate count/fingerprint on success;\n- stable failure type/code on failure.\n\nRouted Skill names must be unique. \`mode: none\` cannot contain Skills. Failed routing cannot claim routed Skills.\n`,
            "routing fields docs",
          );
          docs = replaceOnce(
            docs,
            `- bounded token usage when available;\n- stable error code when applicable.\n`,
            `- bounded token usage when available;\n- the ordered list of emitted Tool-call IDs and names, without arguments;\n- stable error code when applicable.\n`,
            "model finish Tool summary docs",
          );
          docs = replaceOnce(
            docs,
            `- already be terminal before Tool execution begins.\n`,
            `- already be terminal before Tool execution begins;\n- contain the matching emitted Tool-call ID and Tool name.\n`,
            "model origin causal proof docs",
          );
          docs = docs.replace(
            "The resolver emits selection facts where request matching produces routing metadata.",
            "The resolver emits a routing span where request matching produces routing metadata, including a terminal failure when catalog resolution itself fails.",
          );
          docs = replaceOnce(
            docs,
            `- Tool model-origin links to missing/wrong roundtrip spans;\n- Tool execution claiming an origin model span that is still open.\n`,
            `- Tool model-origin links to missing/wrong roundtrip spans;\n- Tool execution claiming an origin model span that is still open;\n- Tool model-origin links whose model response did not emit the matching Tool-call ID/name.\n`,
            "validator causal docs",
          );
          docs = docs.replace(
            "emit metadata-only Skill routing separately from body loads;",
            "emit metadata-only Skill routing start/finish separately from body loads;",
          );
          docs = docs.replace(
            "Skill routing is recorded without falsely claiming that a Skill body was loaded;",
            "Skill routing is terminal on success or failure without falsely claiming that a Skill body was loaded;",
          );
          docs = docs.replace(
            "every populated `modelOrigin` references the matching completed model span;",
            "every populated `modelOrigin` references the completed model span that emitted the same Tool-call ID/name;",
          );
          writeFileSync(docsPath, docs);
          NODE

          pnpm exec vp fmt \
            packages/spark-protocol/src/agent-trace-schema.ts \
            packages/spark-protocol/src/agent-trace-validation.ts \
            packages/spark-protocol/src/agent-tracing.test.ts \
            docs/specs/agent-tracing.md
          pnpm exec vitest run packages/spark-protocol/src/agent-tracing.test.ts
          pnpm --filter @zendev-lab/spark-protocol exec tsc -p tsconfig.json

          if git diff --quiet -- \
            packages/spark-protocol/src/agent-trace-schema.ts \
            packages/spark-protocol/src/agent-trace-validation.ts \
            packages/spark-protocol/src/agent-tracing.test.ts \
            docs/specs/agent-tracing.md; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/spark-protocol/src/agent-trace-schema.ts \
            packages/spark-protocol/src/agent-trace-validation.ts \
            packages/spark-protocol/src/agent-tracing.test.ts \
            docs/specs/agent-tracing.md
          git commit --no-verify -m "✨ feat(protocol): prove Tool and Skill routing causality"
          git push origin HEAD:agent/agent-observability-contract
