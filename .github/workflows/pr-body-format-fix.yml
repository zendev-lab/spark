name: TEMP - PR Body Format Fix

on:
  pull_request:
    paths:
      - scripts/validate-pr-body.mjs
      - test/pr-body-validation.test.ts
      - .github/workflows/pr-body-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit canonical formatting
        run: |
          pnpm exec vp fmt scripts/validate-pr-body.mjs test/pr-body-validation.test.ts
          if git diff --quiet -- scripts/validate-pr-body.mjs test/pr-body-validation.test.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-pr-body.mjs test/pr-body-validation.test.ts
          git commit --no-verify -m "🎨 style(ci): format PR body contract"
          git push origin HEAD:${{ github.head_ref }}
