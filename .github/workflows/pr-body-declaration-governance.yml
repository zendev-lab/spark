name: TEMP - PR Body Declaration Governance

on:
  pull_request:
    paths:
      - scripts/validate-pr-body.d.mts
      - .github/workflows/pr-body-declaration-governance.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh declaration evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const fixturePath = "test/fixtures/architecture-governance.json";
          const fixture = JSON.parse(readFileSync(fixturePath, "utf8"));
          for (const path of ["scripts/validate-pr-body.d.mts", "scripts/validate-pr-body.mjs"]) {
            const source = readFileSync(path, "utf8");
            const lineCount = source.length === 0 ? 0 : source.split("\n").length - (source.endsWith("\n") ? 1 : 0);
            const entry = fixture.scriptsInventory.find((candidate) => candidate.path === path);
            if (!entry) throw new Error(`${path} is missing from architecture governance fixture`);
            entry.lineCount = lineCount;
          }
          writeFileSync(fixturePath, `${JSON.stringify(fixture, null, 2)}\n`);
          NODE
          pnpm exec vp fmt test/fixtures/architecture-governance.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const fixturePath = "test/fixtures/architecture-governance.json";
          const fixtureSource = readFileSync(fixturePath, "utf8");
          const fixtureHash = createHash("sha256").update(fixtureSource).digest("hex");
          const testPath = "test/architecture-ratchets.test.ts";
          const testSource = readFileSync(testPath, "utf8");
          const updated = testSource.replace(
            /const architectureGovernanceFixtureSha256 =\n\s*"[a-f0-9]{64}";/u,
            `const architectureGovernanceFixtureSha256 =\n  "${fixtureHash}";`,
          );
          if (updated === testSource) throw new Error("fixture hash declaration was not updated");
          writeFileSync(testPath, updated);
          NODE
          pnpm exec vp fmt scripts/validate-pr-body.d.mts test/architecture-ratchets.test.ts

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-pr-body.d.mts test/fixtures/architecture-governance.json test/architecture-ratchets.test.ts
          git commit --no-verify -m "✅ test(ci): refresh PR body declaration evidence"
          git push origin HEAD:${{ github.head_ref }}
