name: "CI - Benchmarks"

on:
  # CodSpeed needs successful default-branch runs as PR comparison baselines.
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "apps/spark-docs/**"
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-benchmarks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-walltime:
    name: Select I/O Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.select.outputs.files }}
      has_benchmarks: ${{ steps.select.outputs.has_benchmarks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select relevant benchmarks
        id: select
        run: node --experimental-strip-types scripts/select-benchmark-files.mts
        env:
          BENCHMARK_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          BENCHMARK_LANE: walltime

  cpu-benchmarks:
    name: CPU Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select relevant benchmarks
        id: select
        run: node --experimental-strip-types scripts/select-benchmark-files.mts
        env:
          BENCHMARK_ALL: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          BENCHMARK_LANE: simulation
      - name: Run CodSpeed benchmarks
        if: steps.select.outputs.has_benchmarks == 'true'
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          run: pnpm run bench:codspeed:selected
        env:
          BENCHMARK_LANE: simulation
          SPARK_BENCHMARK_FILES: ${{ steps.select.outputs.files }}

  io-benchmarks:
    name: I/O Benchmarks
    needs: select-walltime
    if: needs.select-walltime.outputs.has_benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Node.js runtime
        id: node-runtime
        shell: bash
        run: |
          version="$(tr -d '\r\n' < .node-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=.node-version::.node-version must contain an exact semver"
            exit 1
          fi
          printf 'spec=node@%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: ${{ steps.node-runtime.outputs.spec }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: pnpm run bench:codspeed:selected
        env:
          BENCHMARK_LANE: walltime
          SPARK_BENCHMARK_FILES: ${{ needs.select-walltime.outputs.files }}
