name: "CI - Benchmarks"

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lens:
    name: Lens Production Paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # @codspeed/core 5.7.1's Linux addon is not compatible with Node 26 yet.
          # This exception is benchmark-only; product CI remains on .node-version.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          run: pnpm run bench:lens:codspeed
