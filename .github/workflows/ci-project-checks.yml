name: "CI - Project Checks"

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-project-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project:
    name: Project Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/spark-node-setup
      - name: Check architecture transition from main
        run: pnpm run check:architecture-transition -- --base-ref origin/main
      - run: pnpm run check:static
