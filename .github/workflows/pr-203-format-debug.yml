name: PR 203 format debug

on:
  pull_request:
    paths:
      - apps/spark-hub/src/lib/components/conversation/thinking-chain-view.ts
      - .github/workflows/pr-203-format-debug.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show formatter patch
        run: |
          pnpm exec vp fmt apps/spark-hub/src/lib/components/conversation/thinking-chain-view.ts
          git diff -- apps/spark-hub/src/lib/components/conversation/thinking-chain-view.ts
          test -z "$(git diff --name-only -- apps/spark-hub/src/lib/components/conversation/thinking-chain-view.ts)"
