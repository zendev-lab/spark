name: TEMP - Agent Trace Semantics Fix

on:
  pull_request:
    paths:
      - packages/spark-protocol/src/agent-trace-schema.ts
      - packages/spark-protocol/src/agent-trace-validation.ts
      - packages/spark-protocol/src/agent-tracing.test.ts
      - docs/specs/agent-tracing.md
      - .github/workflows/agent-trace-semantics-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align Skill routing and run boundary semantics
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const sourceFiles = [
            "packages/spark-protocol/src/agent-trace-schema.ts",
            "packages/spark-protocol/src/agent-trace-validation.ts",
            "packages/spark-protocol/src/agent-tracing.test.ts",
          ];
          const replacements = [
            ["skill.selection.finished", "skill.routing.finished"],
            ["SPARK_AGENT_SKILL_SELECTION_MODES", "SPARK_AGENT_SKILL_ROUTING_MODES"],
            ["sparkAgentSkillSelectionModeSchema", "sparkAgentSkillRoutingModeSchema"],
            ["sparkAgentSkillSelectionTraceEventSchema", "sparkAgentSkillRoutingTraceEventSchema"],
            ["SparkAgentSkillSelectionMode", "SparkAgentSkillRoutingMode"],
            ["selectionFingerprint", "routingFingerprint"],
            ["event:skills:selected", "event:skills:routed"],
          ];
          for (const path of sourceFiles) {
            let source = readFileSync(path, "utf8");
            for (const [from, to] of replacements) source = source.split(from).join(to);
            writeFileSync(path, source);
          }

          const docsPath = "docs/specs/agent-tracing.md";
          let docs = readFileSync(docsPath, "utf8");
          const docReplacements = [
            ["Skill routing selection", "Skill routing"],
            ["Skill selection event", "Skill routing event"],
            ["skill.selection.finished", "skill.routing.finished"],
            ["selection mode", "routing mode"],
            ["selection fingerprint", "routing fingerprint"],
            ["Selected Skill names", "Routed Skill names"],
            ["A selected routing metadata entry", "A routed metadata entry"],
            ["Skill selection is versioned", "Skill routing is versioned"],
            ["Skill routing selection is recorded", "Skill routing is recorded"],
          ];
          for (const [from, to] of docReplacements) docs = docs.split(from).join(to);

          const oldBoundary = `### Run and model boundary\n\n\`SparkAgentLoop.runTurns()\` owns run/model lifecycle emission. The existing prompt manifest provides the model, prompt hashes, Tool-profile fingerprint, selected Skill names, and roundtrip index without retaining prompt text.\n\nThe model finish event is emitted when the provider response reaches its terminal outcome, before any returned Tool call is dispatched.`;
          const newBoundary = `### Run and model boundary\n\nThe run trace context must exist **before request-scoped preparation**. Native user submission currently awaits \`prepareUserSubmit()\` before calling the shared core \`submitWithOutcome()\`, and automatic Skill routing occurs inside that preparation hook. Therefore \`agent.run.started\` must wrap preparation plus core execution for a real user submit; trigger and restart-resume paths create the same run context at their equivalent entry boundary.\n\n\`SparkAgentLoop.runTurns()\` owns model-roundtrip lifecycle inside that already-open run. The existing prompt manifest provides the model, prompt hashes, Tool-profile fingerprint, routed Skill names, and roundtrip index without retaining prompt text.\n\nThe model finish event is emitted when the provider response reaches its terminal outcome, before any returned Tool call is dispatched.`;
          if (!docs.includes(oldBoundary)) throw new Error("run/model boundary documentation block not found");
          docs = docs.replace(oldBoundary, newBoundary);
          writeFileSync(docsPath, docs);
          NODE

          pnpm exec vp fmt \
            packages/spark-protocol/src/agent-trace-schema.ts \
            packages/spark-protocol/src/agent-trace-validation.ts \
            packages/spark-protocol/src/agent-tracing.test.ts \
            docs/specs/agent-tracing.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/spark-protocol/src/agent-trace-schema.ts \
            packages/spark-protocol/src/agent-trace-validation.ts \
            packages/spark-protocol/src/agent-tracing.test.ts \
            docs/specs/agent-tracing.md
          git commit --no-verify -m "♻️ refactor(protocol): distinguish Skill routing from use"
          git push origin HEAD:${{ github.head_ref }}
