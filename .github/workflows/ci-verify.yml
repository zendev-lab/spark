name: "CI - Verify"

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static checks
        run: pnpm run check:static
      - name: Docs checks
        run: pnpm run check:docs
      - name: Docs deployment dry run
        run: pnpm --filter @zendev-lab/spark-docs exec wrangler deploy --dry-run

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: pnpm run test:unit
      - name: Source process tests
        run: pnpm run test:process:source

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Packed product smoke tests
        run: pnpm run smoke
      - name: Install Chromium
        run: pnpm --filter @zendev-lab/spark-hub run setup:browser
      - name: Hub browser tests
        run: pnpm run test:browser:hub

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Hub container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: spark-hub:ci
          build-args: |
            SPARK_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=spark-hub
          cache-to: type=gha,mode=max,scope=spark-hub,ignore-error=true
      - name: Smoke Hub container
        run: |
          container_id="$(docker run --detach \
            --env HOST=127.0.0.1 \
            --env SPARK_HUB_PUBLIC_URL=https://spark.example.test \
            --env SPARK_HUB_TRUST_PROXY=loopback \
            spark-hub:ci)"
          test -n "${container_id}"
          trap 'test -z "${container_id:-}" || docker rm --force "${container_id}" >/dev/null' EXIT
          status=starting
          for _ in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")"
            test "${status}" != healthy || break
            running="$(docker inspect --format '{{.State.Running}}' "${container_id}")"
            test "${running}" = true || break
            sleep 1
          done
          if test "${status}" != healthy; then
            docker inspect --format '{{json .State}}' "${container_id}"
            docker logs "${container_id}"
            exit 1
          fi
          docker exec "${container_id}" node -e '
            const response = await fetch("http://127.0.0.1:5173/workspaces/new", {
              headers: {
                accept: "text/html",
                host: "spark.example.test",
                "x-forwarded-for": "127.0.0.1",
                "x-forwarded-proto": "https",
              },
            });
            if (!response.ok) throw new Error(`workspace route returned ${response.status}`);
          '

  benchmarks:
    name: Lens production paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # @codspeed/core 5.7.1's Linux addon is not compatible with Node 26 yet.
          # This exception is benchmark-only; product CI remains on .node-version.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@0ca9cbbf4623b599a6c3ed4fc8a922942705d9f1 # v5.0.2
        with:
          mode: simulation
          run: pnpm run bench:lens:codspeed

  required:
    name: required
    if: ${{ always() }}
    needs:
      - checks
      - tests
      - smoke
      - container
      - benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
