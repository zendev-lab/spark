name: TEMP - Agent Trace Format Diff

on:
  pull_request:
    paths:
      - packages/spark-protocol/src/agent-trace-schema.ts
      - packages/spark-protocol/src/agent-trace-validation.ts
      - .github/workflows/agent-trace-format-debug.yml

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit canonical formatting
        run: |
          pnpm exec vp fmt \
            packages/spark-protocol/src/agent-trace-schema.ts \
            packages/spark-protocol/src/agent-trace-validation.ts
          if git diff --quiet -- \
            packages/spark-protocol/src/agent-trace-schema.ts \
            packages/spark-protocol/src/agent-trace-validation.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/spark-protocol/src/agent-trace-schema.ts \
            packages/spark-protocol/src/agent-trace-validation.ts
          git commit --no-verify -m "🎨 style(protocol): format agent trace contracts"
          git push origin HEAD:${{ github.head_ref }}
