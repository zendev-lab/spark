name: Maintenance - Replay Session Snapshot Index PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/replay-session-snapshot-index-pr.yml

permissions:
  contents: write

jobs:
  replay:
    if: github.head_ref == 'maintenance/replay-session-snapshot-index'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Replay isolated performance commit
        env:
          SOURCE_COMMIT: 102f45d4cd8011b971daafc62cdae8fa1e969b08
          TARGET_BRANCH: perf/session-snapshot-index
        run: |
          set -euo pipefail
          git config user.name "spark-maintenance[bot]"
          git config user.email "spark-maintenance[bot]@users.noreply.github.com"
          git fetch origin main "$TARGET_BRANCH" task/session-tui-performance
          git checkout -B "$TARGET_BRANCH" origin/main

          if ! git cherry-pick "$SOURCE_COMMIT"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              apps/spark-daemon/src/spark/session-run.test.ts
              apps/spark-daemon/src/spark/session-run.ts
            )
            printf 'Replay conflicts: %s\n' "${conflicts[*]}"
            test "${#conflicts[@]}" -eq "${#expected[@]}"
            test "${conflicts[*]}" = "${expected[*]}"

            # Preserve current-main behavior in the two evolved daemon files.
            git checkout --ours -- "${expected[@]}"
            python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          implementation = "apps/spark-daemon/src/spark/session-run.ts"
          replace_once(
              implementation,
              'import { composeAgentSystemPrompt } from "@zendev-lab/spark-phases";\n',
              'import { composeAgentSystemPrompt } from "@zendev-lab/spark-phases";\n'
              'import { refreshSparkSessionSnapshotIndex } from "@zendev-lab/spark-session";\n',
          )
          replace_once(
              implementation,
              '  createSparkHeadlessSessionExecutor?: CreateSparkHeadlessSessionExecutorFn;\n',
              '  createSparkHeadlessSessionExecutor?: CreateSparkHeadlessSessionExecutorFn;\n'
              '  refreshSessionSnapshotIndex?: typeof refreshSparkSessionSnapshotIndex;\n',
          )
          replace_once(
              implementation,
              '        const completed = await recordCompletedSessionRun(\n'
              '          effectiveTask,\n'
              '          result,\n'
              '          options.sessionRegistry,\n'
              '        );\n',
              '        const completed = await recordCompletedSessionRun(\n'
              '          effectiveTask,\n'
              '          result,\n'
              '          options.sessionRegistry,\n'
              '          options.refreshSessionSnapshotIndex ?? refreshSparkSessionSnapshotIndex,\n'
              '        );\n',
          )
          replace_once(
              implementation,
              'async function recordCompletedSessionRun(\n'
              '  task: SparkDaemonSessionRunTask,\n'
              '  result: unknown,\n'
              '  registry: Pick<DaemonSessionRegistry, "recordRun" | "recordTurnSettled"> | undefined,\n'
              '): Promise<{ result: unknown; indexed: boolean }> {\n',
              'async function recordCompletedSessionRun(\n'
              '  task: SparkDaemonSessionRunTask,\n'
              '  result: unknown,\n'
              '  registry: Pick<DaemonSessionRegistry, "recordRun" | "recordTurnSettled"> | undefined,\n'
              '  refreshSessionSnapshotIndex: typeof refreshSparkSessionSnapshotIndex,\n'
              '): Promise<{ result: unknown; indexed: boolean }> {\n',
          )
          replace_once(
              implementation,
              '  try {\n'
              '    await registry.recordRun({ sessionId: task.sessionId, sessionPath });\n'
              '    return { result, indexed: true };\n',
              '  try {\n'
              '    await registry.recordRun({ sessionId: task.sessionId, sessionPath });\n'
              '    try {\n'
              '      await refreshSessionSnapshotIndex({ sessionId: task.sessionId, sessionPath });\n'
              '    } catch (error) {\n'
              '      console.error(\n'
              '        `[spark-daemon] failed to refresh completed session snapshot index for ${task.sessionId}: ${errorMessage(error)}`,\n'
              '      );\n'
              '    }\n'
              '    return { result, indexed: true };\n',
          )
          PY

            cat > apps/spark-daemon/src/spark/session-snapshot-index-refresh.test.ts <<'TS'
          import { describe, expect, it, vi } from "vitest";
          import type {
            SparkDaemonSessionRunTask,
            SparkDaemonTaskExecutionContext,
          } from "../core/types.ts";
          import { resolveSparkPaths } from "@zendev-lab/spark-system";
          import { createSparkDaemonTaskExecutor } from "./session-run.ts";

          const paths = resolveSparkPaths({
            app: "daemon",
            env: { HOME: "/tmp/spark-daemon-session-index-refresh-test" },
          });

          function context(): SparkDaemonTaskExecutionContext {
            return {
              invocationId: "invocation-index-refresh",
              signal: new AbortController().signal,
            };
          }

          function task(sessionId: string): SparkDaemonSessionRunTask {
            return {
              type: "session.run",
              sessionId,
              prompt: "hello",
            };
          }

          describe("completed session snapshot index refresh", () => {
            it("refreshes after the durable run index commits", async () => {
              const recordTurnQueued = vi.fn(async () => ({}) as never);
              const recordTurnSettled = vi.fn(async () => ({}) as never);
              const recordRun = vi.fn(async () => ({}) as never);
              const refreshSessionSnapshotIndex = vi.fn(async () => undefined as never);
              const sessionTask = task("sess_index_refresh");
              const sessionPath = "/daemon/sessions/sess_index_refresh.jsonl";
              const executor = createSparkDaemonTaskExecutor({
                paths,
                sessionRegistry: { recordTurnQueued, recordTurnSettled, recordRun },
                refreshSessionSnapshotIndex,
                createSparkHeadlessSessionExecutor: () => async () => ({
                  sessionId: sessionTask.sessionId,
                  sessionPath,
                  assistantText: "done",
                }),
              });

              await expect(executor(sessionTask, context())).resolves.toMatchObject({
                assistantText: "done",
              });
              expect(recordRun).toHaveBeenCalledWith({
                sessionId: sessionTask.sessionId,
                sessionPath,
              });
              expect(refreshSessionSnapshotIndex).toHaveBeenCalledWith({
                sessionId: sessionTask.sessionId,
                sessionPath,
              });
              expect(recordRun.mock.invocationCallOrder[0]).toBeLessThan(
                refreshSessionSnapshotIndex.mock.invocationCallOrder[0]!,
              );
              expect(recordTurnSettled).not.toHaveBeenCalled();
            });

            it("keeps the completed turn committed when refresh fails", async () => {
              const recordTurnQueued = vi.fn(async () => ({}) as never);
              const recordTurnSettled = vi.fn(async () => ({}) as never);
              const recordRun = vi.fn(async () => ({}) as never);
              const refreshSessionSnapshotIndex = vi.fn(async () => {
                throw new Error("index unavailable");
              });
              const error = vi.spyOn(console, "error").mockImplementation(() => undefined);
              const sessionTask = task("sess_index_refresh_failure");
              const sessionPath = "/daemon/sessions/sess_index_refresh_failure.jsonl";
              const executor = createSparkDaemonTaskExecutor({
                paths,
                sessionRegistry: { recordTurnQueued, recordTurnSettled, recordRun },
                refreshSessionSnapshotIndex,
                createSparkHeadlessSessionExecutor: () => async () => ({
                  sessionId: sessionTask.sessionId,
                  sessionPath,
                  assistantText: "done",
                }),
              });

              try {
                await expect(executor(sessionTask, context())).resolves.toMatchObject({
                  assistantText: "done",
                });
                expect(recordRun).toHaveBeenCalledOnce();
                expect(refreshSessionSnapshotIndex).toHaveBeenCalledOnce();
                expect(recordTurnSettled).not.toHaveBeenCalled();
                expect(error).toHaveBeenCalledWith(
                  expect.stringContaining("failed to refresh completed session snapshot index"),
                );
              } finally {
                error.mockRestore();
              }
            });
          });
          TS

            git add "${expected[@]}" apps/spark-daemon/src/spark/session-snapshot-index-refresh.test.ts
            GIT_EDITOR=true git cherry-pick --continue
          fi

          git push --force-with-lease origin "HEAD:$TARGET_BRANCH"
