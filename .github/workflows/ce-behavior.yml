name: "CE - Behavior"

on:
  schedule:
    # Daily 18:37 UTC (03:37 JST)
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Repeated behavior-suite runs (1-50)"
        required: false
        default: "8"

concurrency:
  group: ce-behavior-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SPARK_NIGHTLY_CE_RUNS: ${{ inputs.runs || '8' }}
  SPARK_NIGHTLY_CE_MAX_FAILURE_RATE: "0"
  SPARK_NIGHTLY_CE_MAX_DURATION_P95_MS: "30000"
  SPARK_NIGHTLY_CE_RUN_TIMEOUT_MS: "120000"
  SPARK_SCRIPTED_PROVIDER_CE_SOURCE_SHA: ${{ github.sha }}
  SPARK_SCRIPTED_PROVIDER_CE_RUNS: ${{ inputs.runs || '8' }}
  SPARK_SCRIPTED_PROVIDER_CE_MAX_FAILURE_RATE: "0"
  SPARK_SCRIPTED_PROVIDER_CE_MAX_DURATION_P95_MS: "10000"
  SPARK_SCRIPTED_PROVIDER_CE_RUN_TIMEOUT_MS: "60000"

jobs:
  capability-ce:
    name: capability-ce
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/spark-node-setup
      - name: Run repeated capability CE
        run: pnpm run test:capability:ce
      - name: Upload capability CE reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capability-ce-reports
          path: reports/capability-ce/
          if-no-files-found: warn
          retention-days: 30

  scripted-provider-ce:
    name: scripted-provider-ce
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/spark-node-setup
      - name: Run scripted provider CE
        run: node --experimental-strip-types scripts/run-scripted-provider-ce.mts
      - name: Upload scripted-provider CE reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scripted-provider-ce-reports
          path: reports/scripted-provider-ce/
          if-no-files-found: warn
          retention-days: 30
