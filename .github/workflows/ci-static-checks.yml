name: "CI - Static Checks"

# PR hook lane: prek hooks except spark-check-fix. Grouped static/docs verification
# runs in ci-verify.yml alongside the tests and smoke jobs.
on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-static-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Use the repo-pinned prek binary. The action cache is PR-ref scoped and
      # restoring it twice cost substantially more than the hooks themselves.
      - run: pnpm exec prek run --all-files --skip spark-check-fix
