name: TEMP - PR Body Governance Format

on:
  pull_request:
    paths:
      - test/fixtures/architecture-governance.json
      - test/architecture-ratchets.test.ts
      - .github/workflows/pr-body-governance-format.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and seal fixture
        run: |
          pnpm exec vp fmt test/fixtures/architecture-governance.json
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const fixturePath = "test/fixtures/architecture-governance.json";
          const fixtureSource = readFileSync(fixturePath, "utf8");
          const fixtureHash = createHash("sha256").update(fixtureSource).digest("hex");
          const testPath = "test/architecture-ratchets.test.ts";
          const testSource = readFileSync(testPath, "utf8");
          const updated = testSource.replace(
            /const architectureGovernanceFixtureSha256 =\n\s*"[a-f0-9]{64}";/u,
            `const architectureGovernanceFixtureSha256 =\n  "${fixtureHash}";`,
          );
          if (updated === testSource) throw new Error("fixture hash declaration was not updated");
          writeFileSync(testPath, updated);
          NODE
          pnpm exec vp fmt test/architecture-ratchets.test.ts

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/fixtures/architecture-governance.json test/architecture-ratchets.test.ts
          git commit --no-verify -m "🎨 style(ci): seal PR body governance fixture"
          git push origin HEAD:${{ github.head_ref }}
