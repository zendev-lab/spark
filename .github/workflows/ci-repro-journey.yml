name: "CI - Repro Journey"

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ci-repro-journey-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repro-journey:
    name: Repro Golden Journey (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/spark-node-setup
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - name: Install pinned cue-shell runtime
        run: |
          cargo install \
            --git https://github.com/zendev-lab/cue.git \
            --rev 3d596c626f8a5c3fec02499ecc28094ed80aabc4 \
            --locked \
            --root "${RUNNER_TEMP}/cue-shell" \
            cue-cli
          echo "${RUNNER_TEMP}/cue-shell/bin" >> "${GITHUB_PATH}"
      - run: pnpm run test:journey:repro
