name: Temporary format PR 202

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/prompt-operating-model
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped files
        run: |
          pnpm exec vp fmt \
            packages/spark-artifacts/src/git/review-state.test.ts \
            packages/spark-artifacts/src/git/review-state.ts \
            packages/spark-host/src/system-prompt.ts \
            packages/spark-roles/src/skill-extension.ts \
            --write
      - name: Commit formatter output
        run: |
          if git diff --quiet -- \
            packages/spark-artifacts/src/git/review-state.test.ts \
            packages/spark-artifacts/src/git/review-state.ts \
            packages/spark-host/src/system-prompt.ts \
            packages/spark-roles/src/skill-extension.ts; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/spark-artifacts/src/git/review-state.test.ts \
            packages/spark-artifacts/src/git/review-state.ts \
            packages/spark-host/src/system-prompt.ts \
            packages/spark-roles/src/skill-extension.ts
          git commit --no-verify -m "🎨 style: format prompt refactor files"
          git push origin HEAD:agent/prompt-operating-model
