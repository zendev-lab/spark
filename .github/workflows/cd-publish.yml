name: "CD - Publish"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repository checks
        run: pnpm run check

      - name: Install Chromium
        run: pnpm --filter @zendev-lab/spark-hub run setup:browser

      - name: Run Hub browser tests
        run: pnpm run test:browser:hub

      - name: Build all release artifacts once
        env:
          SPARK_BUILD_GIT_SHA: ${{ github.sha }}
        run: pnpm run release:pack

      - name: Verify release metadata
        run: node scripts/verify-release-state.mjs --artifact-only

      - name: Smoke the exact lockstep artifacts
        run: >-
          node scripts/smoke-npm-product.mjs
          --spark-tarball dist/release/spark-${{ github.ref_name }}.tgz
          --cli-tarball dist/release/spark-cli-${{ github.ref_name }}.tgz
          --daemon-tarball dist/release/spark-daemon-${{ github.ref_name }}.tgz
          --tui-tarball dist/release/spark-tui-${{ github.ref_name }}.tgz
          --hub-tarball dist/release/spark-hub-${{ github.ref_name }}.tgz

      - name: Verify N-1 expand-only migration compatibility
        run: >-
          node scripts/test-release-migration.mjs
          --tarball dist/release/spark-${{ github.ref_name }}.tgz
          --daemon-tarball dist/release/spark-daemon-${{ github.ref_name }}.tgz
          --tui-tarball dist/release/spark-tui-${{ github.ref_name }}.tgz
          --hub-tarball dist/release/spark-hub-${{ github.ref_name }}.tgz

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spark-release-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spark-release-${{ github.ref_name }}
          path: dist/release

      - name: Verify artifacts and published state
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-state.mjs

      - name: Stage draft GitHub Release
        if: steps.release.outputs.github_published != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Spark ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*.tgz
            dist/release/*-release-manifest.json
            dist/release/release-manifest.json
            dist/release/SHA256SUMS

      - name: Publish the exact daemon artifact to npm
        if: steps.release.outputs.npm_daemon_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-daemon-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true
          token: ${{ secrets.NPM_TOKEN }}

      - name: Publish the exact Hub artifact to npm
        if: steps.release.outputs.npm_hub_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-hub-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true
          token: ${{ secrets.NPM_TOKEN }}

      - name: Publish the exact TUI artifact to npm
        if: steps.release.outputs.npm_tui_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-tui-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true
          token: ${{ secrets.NPM_TOKEN }}

      - name: Publish the real spark CLI artifact to npm
        if: steps.release.outputs.npm_cli_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-cli-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true
          token: ${{ secrets.NPM_TOKEN }}

      - name: Publish the complete Spark meta package to npm
        if: steps.release.outputs.npm_spark_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true
          token: ${{ secrets.NPM_TOKEN }}

      - name: Attest npm release artifacts
        if: steps.release.outputs.github_published != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/release/*.tgz

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check versioned container image
        id: container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          version="${VERSION_TAG#v}"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${version}" >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        if: steps.container.outputs.published != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: steps.container.outputs.published != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract container metadata
        if: steps.container.outputs.published != 'true'
        id: container-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and publish container image
        if: steps.container.outputs.published != 'true'
        id: container-publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.container-metadata.outputs.tags }}
          labels: ${{ steps.container-metadata.outputs.labels }}
          build-args: |
            SPARK_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=spark-hub
          cache-to: type=gha,mode=max,scope=spark-hub

      - name: Attest container image
        if: steps.container.outputs.published != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.container-publish.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub Release after npm succeeds
        if: steps.release.outputs.github_published != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
