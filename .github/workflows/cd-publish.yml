name: "CD - Publish"

on:
  push:
    tags:
      - "v*"
  pull_request:
  merge_group:
    types:
      - checks_requested

concurrency:
  group: cd-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation Deployment Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:docs
      - run: pnpm --filter @zendev-lab/spark-docs exec wrangler deploy --dry-run

  container:
    name: Container Build and Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Hub container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: spark-hub:ci
          build-args: |
            SPARK_BUILD_GIT_SHA=${{ github.sha }}
      - name: Smoke Hub container
        run: |
          container_id="$(docker run --detach \
            --env HOST=127.0.0.1 \
            --env SPARK_HUB_PUBLIC_URL=https://spark.example.test \
            --env SPARK_HUB_TRUST_PROXY=loopback \
            spark-hub:ci)"
          test -n "${container_id}"
          trap 'test -z "${container_id:-}" || docker rm --force "${container_id}" >/dev/null' EXIT
          status=starting
          for _ in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")"
            test "${status}" != healthy || break
            running="$(docker inspect --format '{{.State.Running}}' "${container_id}")"
            test "${running}" = true || break
            sleep 1
          done
          if test "${status}" != healthy; then
            docker inspect --format '{{json .State}}' "${container_id}"
            docker logs "${container_id}"
            exit 1
          fi
          docker exec "${container_id}" node -e '
            const response = await fetch("http://127.0.0.1:5173/workspaces/new", {
              headers: {
                accept: "text/html",
                host: "spark.example.test",
                "x-forwarded-for": "127.0.0.1",
                "x-forwarded-proto": "https",
              },
            });
            if (!response.ok) throw new Error(`workspace route returned ${response.status}`);
          '

  native-cli:
    name: Native CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust target
        run: |
          rustup target add "${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *-linux-musl)
              sudo apt-get update
              sudo apt-get install --yes musl-tools
              ;;
          esac
      - name: Test and build the native CLI
        env:
          SPARK_BUILD_GIT_SHA: ${{ github.sha }}
        run: |
          cargo test --workspace --locked
          cargo build --release --locked --target "${{ matrix.target }}" --package spark-cli
      - name: Smoke native routing and enforce the compressed size budget
        run: |
          binary="target/${{ matrix.target }}/release/spark"
          "${binary}" --help >/dev/null
          "${binary}" version --json | node -e '
            let source = "";
            process.stdin.on("data", (chunk) => source += chunk);
            process.stdin.on("end", () => {
              const build = JSON.parse(source);
              if (build.deploymentGeneration !== 2) process.exit(1);
            });
          '
          SPARK_WEB_COMMAND="$(command -v node)" "${binary}" web --version >/dev/null
          archive="spark-cli-${{ matrix.target }}.tar.gz"
          tar -czf "${archive}" -C "$(dirname "${binary}")" spark
          size="$(wc -c < "${archive}" | tr -d ' ')"
          test "${size}" -le 2097152 || {
            echo "${archive} is ${size} bytes; the limit is 2097152" >&2
            exit 1
          }
      - name: Upload the native CLI payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spark-cli-native-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/spark
          if-no-files-found: error
          retention-days: 7

  build:
    name: Release Build
    needs: native-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download native CLI payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spark-cli-native-*
          path: dist/native

      - name: Normalize native CLI artifact paths
        run: |
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl; do
            native_source="dist/native/spark-cli-native-${target}/spark"
            test -f "${native_source}"
            chmod 755 "${native_source}"
            mkdir -p "dist/native/${target}"
            mv "${native_source}" "dist/native/${target}/spark"
          done

      - name: Verify live-model Repro capability
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          SPARK_REPRO_LIVE_MODEL: ${{ vars.SPARK_REPRO_LIVE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm run test:capability:repro-live

      - name: Resolve release tag
        run: |
          node -e '
            const { appendFileSync, readFileSync } = require("node:fs");
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error("Invalid release version: " + JSON.stringify(version));
            }
            appendFileSync(process.env.GITHUB_ENV, "RELEASE_TAG=v" + version + "\n");
          '

      - name: Build all release artifacts once
        env:
          SPARK_BUILD_GIT_SHA: ${{ github.sha }}
        run: pnpm run release:pack

      - name: Verify release metadata
        run: |
          if test "${GITHUB_REF_TYPE}" != tag; then
            export GITHUB_REF_NAME="${RELEASE_TAG}"
          fi
          node scripts/verify-release-state.mjs --artifact-only

      - name: Smoke the exact lockstep artifacts
        run: >-
          node scripts/smoke-npm-product.mjs
          --spark-tarball "dist/release/spark-${RELEASE_TAG}.tgz"
          --cli-tarball "dist/release/spark-cli-${RELEASE_TAG}.tgz"
          --daemon-tarball "dist/release/spark-daemon-${RELEASE_TAG}.tgz"
          --hub-tarball "dist/release/spark-hub-${RELEASE_TAG}.tgz"
          --web-tarball "dist/release/spark-web-${RELEASE_TAG}.tgz"
          --web-dsh-tarball "dist/release/spark-web-dsh-${RELEASE_TAG}.tgz"
          --native-darwin-arm64-tarball "dist/release/spark-cli-aarch64-apple-darwin-npm-${RELEASE_TAG}.tgz"
          --native-linux-arm64-tarball "dist/release/spark-cli-aarch64-unknown-linux-musl-npm-${RELEASE_TAG}.tgz"
          --native-linux-x64-tarball "dist/release/spark-cli-x86_64-unknown-linux-musl-npm-${RELEASE_TAG}.tgz"

      - name: Verify declared N-1 migration policy
        run: >-
          node scripts/test-release-migration.mjs
          --tarball "dist/release/spark-${RELEASE_TAG}.tgz"
          --cli-tarball "dist/release/spark-cli-${RELEASE_TAG}.tgz"
          --daemon-tarball "dist/release/spark-daemon-${RELEASE_TAG}.tgz"
          --hub-tarball "dist/release/spark-hub-${RELEASE_TAG}.tgz"
          --web-tarball "dist/release/spark-web-${RELEASE_TAG}.tgz"
          --web-dsh-tarball "dist/release/spark-web-dsh-${RELEASE_TAG}.tgz"

      - name: Upload release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spark-release-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - documentation
      - container
      - build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spark-release-${{ github.ref_name }}
          path: dist/release

      - name: Verify artifacts and published state
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-state.mjs

      - name: Stage draft GitHub Release
        if: steps.release.outputs.github_published != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Spark ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*.tgz
            dist/release/*.tar.gz
            dist/release/*-release-manifest.json
            dist/release/release-manifest.json
            dist/release/SHA256SUMS
            dist/release/install.sh

      - name: Publish native macOS arm64 package
        if: steps.release.outputs['npm_native-darwin-arm64_published'] != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-cli-aarch64-apple-darwin-npm-${{ github.ref_name }}.tgz
          access: public
          tag: native-staging-${{ github.run_id }}
          provenance: true

      - name: Publish native Linux arm64 package
        if: steps.release.outputs['npm_native-linux-arm64_published'] != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-cli-aarch64-unknown-linux-musl-npm-${{ github.ref_name }}.tgz
          access: public
          tag: native-staging-${{ github.run_id }}
          provenance: true

      - name: Publish native Linux x64 package
        if: steps.release.outputs['npm_native-linux-x64_published'] != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-cli-x86_64-unknown-linux-musl-npm-${{ github.ref_name }}.tgz
          access: public
          tag: native-staging-${{ github.run_id }}
          provenance: true

      - name: Publish the exact daemon artifact to npm
        if: steps.release.outputs.npm_daemon_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-daemon-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true

      - name: Publish the exact Hub artifact to npm
        if: steps.release.outputs.npm_hub_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-hub-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true

      - name: Publish the exact Web artifact to npm
        if: steps.release.outputs.npm_web_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-web-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true

      - name: Publish the exact DSH Web artifact to npm
        if: steps.release.outputs['npm_web-dsh_published'] != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-web-dsh-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true

      - name: Publish the real spark CLI artifact to npm
        if: steps.release.outputs.npm_cli_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-cli-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true

      - name: Publish the complete Spark meta package to npm
        if: steps.release.outputs.npm_spark_published != 'true'
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: dist/release/spark-${{ github.ref_name }}.tgz
          access: public
          tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          provenance: true

      - name: Attest release artifacts
        if: steps.release.outputs.github_published != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*.tgz
            dist/release/*.tar.gz
            dist/release/*-release-manifest.json
            dist/release/release-manifest.json
            dist/release/SHA256SUMS
            dist/release/install.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check versioned container image
        id: container
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          version="${VERSION_TAG#v}"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${version}" >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        if: steps.container.outputs.published != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: steps.container.outputs.published != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract container metadata
        if: steps.container.outputs.published != 'true'
        id: container-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and publish container image
        if: steps.container.outputs.published != 'true'
        id: container-publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.container-metadata.outputs.tags }}
          labels: ${{ steps.container-metadata.outputs.labels }}
          build-args: |
            SPARK_BUILD_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=spark-hub
          cache-to: type=gha,mode=max,scope=spark-hub

      - name: Attest container image
        if: steps.container.outputs.published != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.container-publish.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub Release after npm succeeds
        if: steps.release.outputs.github_published != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
