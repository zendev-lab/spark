name: Maintenance - Format Session Snapshot Index

on:
  push:
    branches:
      - perf/session-snapshot-index
    paths:
      - .github/workflows/format-session-snapshot-index.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/session-snapshot-index
          fetch-depth: 0
          persist-credentials: true
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Apply canonical formatter and remove this workflow
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec vp fmt apps/spark-daemon/src/spark/session-snapshot-index-refresh.test.ts
          git rm .github/workflows/format-session-snapshot-index.yml
          git config user.name "spark-maintenance[bot]"
          git config user.email "spark-maintenance[bot]@users.noreply.github.com"
          git add apps/spark-daemon/src/spark/session-snapshot-index-refresh.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "style(session): apply canonical snapshot refresh formatting"
          git push origin HEAD:perf/session-snapshot-index
