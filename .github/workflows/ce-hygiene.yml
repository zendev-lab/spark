name: "CE - Hygiene"

on:
  schedule:
    # Tuesdays 04:17 UTC (day after mutation CE)
    - cron: "17 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ce-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene-reports:
    name: Hygiene Reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate hygiene reports
        run: pnpm run report:hygiene

      - name: Upload hygiene CE reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hygiene-ce-reports
          path: |
            reports/knip-report.json
            reports/knip-console.txt
            reports/jscpd/
            reports/complexity.txt
          if-no-files-found: ignore
          retention-days: 14
