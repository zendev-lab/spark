name: "CE - Hygiene"

on:
  schedule:
    # Tuesdays 04:17 UTC (day after mutation CE)
    - cron: "17 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ce-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene-reports:
    name: Hygiene Reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate hygiene reports
        run: pnpm run report:hygiene

      - name: Upload hygiene CE reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hygiene-ce-reports
          path: |
            reports/knip-report.json
            reports/knip-console.txt
            reports/jscpd/
            reports/complexity.txt
          if-no-files-found: ignore
          retention-days: 14
