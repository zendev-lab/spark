name: "CI - Dependency Audit"

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-dependency-audit.yml"
      - "apps/*/package.json"
      - "package.json"
      - "packages/*/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  pull-request-dependencies:
    name: New Dependency Vulnerabilities
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Inline of osv-scanner-reusable-pr.yml so the check stays two levels.
      - name: Checkout target branch
        run: git checkout "$GITHUB_BASE_REF"

      - name: Run scanner on existing code
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --lockfile=pnpm-lock.yaml

      - name: Checkout current branch
        run: git checkout -f "$GITHUB_SHA"

      - name: Run scanner on new code
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --lockfile=pnpm-lock.yaml

      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

  complete-dependencies:
    name: Complete Dependency Vulnerability Audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inline of osv-scanner-reusable.yml so the check stays two levels.
      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --lockfile=pnpm-lock.yaml

      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload artifact
        id: upload_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

      - name: Print code scanning URL
        if: ${{ !cancelled() }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "View the OSV-Scanner results in the 'Security' tab, using the following link:"
          echo "${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=is%3Aopen+branch%3A${GITHUB_REF_NAME}+tool%3Aosv-scanner"

      - name: Error troubleshooter
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::Artifact upload failed. This is most likely caused by an error during scanning earlier in the workflow."
          exit 1
