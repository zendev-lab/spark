name: TEMP - Repair Agent Trace Causality Fix

on:
  pull_request:
    paths:
      - .github/workflows/agent-trace-causality-bootstrap.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - name: Remove invalid no-op replacement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-trace-causality-fix.yml')
          source = path.read_text()
          block = '''          test = replaceOnce(
            test,
            `    cacheWriteTokens: 0,\\n`,
            `    cacheWriteTokens: 0,\\n`,
            "noop token placeholder",
          );
'''
          if block not in source:
              raise SystemExit('expected no-op replacement block not found')
          path.write_text(source.replace(block, ''))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/agent-trace-causality-fix.yml
          git commit --no-verify -m "👷 ci: fix temporary trace causality transformer"
          git push origin HEAD:${{ github.head_ref }}
