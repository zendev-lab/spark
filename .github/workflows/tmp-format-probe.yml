name: Temporary prompt formatter probe

on:
  push:
    branches:
      - agent/prompt-operating-model
    paths:
      - .github/workflows/tmp-format-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed prompt files
        run: |
          pnpm exec vp fmt \
            packages/spark-artifacts/src/git/review-state.test.ts \
            packages/spark-artifacts/src/git/review-state.ts \
            packages/spark-host/src/system-prompt.ts \
            packages/spark-roles/src/skill-extension.ts \
            packages/spark-roles/src/spark-skill-agent.test.ts
      - name: Print formatter patch
        run: |
          git diff -- \
            packages/spark-artifacts/src/git/review-state.test.ts \
            packages/spark-artifacts/src/git/review-state.ts \
            packages/spark-host/src/system-prompt.ts \
            packages/spark-roles/src/skill-extension.ts \
            packages/spark-roles/src/spark-skill-agent.test.ts
