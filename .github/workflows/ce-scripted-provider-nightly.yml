name: "CE - Scripted Provider Nightly"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ce-scripted-provider-nightly.yml"
      - "docs/operations/scripted-provider-ce.md"
      - "packages/spark-turn/src/agent-loop.ts"
      - "packages/spark-turn/src/behavior-ce.ts"
      - "packages/spark-turn/src/run-turns.ts"
      - "packages/spark-turn/src/tool-dispatch.ts"
      - "packages/spark-turn/src/testing/scripted-provider.ts"
      - "packages/spark-turn/src/spark-scripted-provider.test.ts"
      - "scripts/capability-ce-output-directory.mts"
      - "scripts/run-scripted-provider-ce.mts"
  schedule:
    # Daily 19:07 UTC (04:07 JST)
    - cron: "7 19 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Repeated scripted-provider runs (1-50)"
        required: false
        default: "8"

concurrency:
  group: ce-scripted-provider-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripted-provider-ce:
    name: scripted-provider-ce
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      SPARK_SCRIPTED_PROVIDER_CE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SPARK_SCRIPTED_PROVIDER_CE_RUNS: ${{ github.event_name == 'pull_request' && '2' || inputs.runs || '8' }}
      SPARK_SCRIPTED_PROVIDER_CE_MAX_FAILURE_RATE: "0"
      SPARK_SCRIPTED_PROVIDER_CE_MAX_DURATION_P95_MS: "10000"
      SPARK_SCRIPTED_PROVIDER_CE_RUN_TIMEOUT_MS: "60000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run scripted provider CE
        run: node --experimental-strip-types scripts/run-scripted-provider-ce.mts

      - name: Upload scripted provider CE report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scripted-provider-ce-report
          path: reports/scripted-provider-ce/
          if-no-files-found: warn
          retention-days: 30
