packages:
  - "apps/*"
  - "packages/*"

# Keep pnpm run/exec read-only while prek temporarily hides unstaged manifests.
verifyDepsBeforeRun: warn

allowBuilds:
  "@google/genai": true
  better-sqlite3: true
  esbuild: true
  koffi: true
  protobufjs: true
  sharp: true
  workerd: true

catalog:
  "@zendev-lab/cue": "0.1.2"
  axe-core: "4.13.0"
  "@agentclientprotocol/sdk": "1.3.0"
  "@modelcontextprotocol/sdk": "1.30.0"
  "@optique/core": "1.2.0"
  "@orpc/client": "1.15.0"
  "@orpc/contract": "1.15.0"
  "@orpc/server": "1.15.0"
  "@stryker-mutator/core": "10.0.0"
  "@stryker-mutator/vitest-runner": "10.0.0"
  "@types/ws": "^8.18.1"
  es-toolkit: "^1.49.0"
  fast-check: "4.9.0"
  "p-retry": "^8.0.0"
  typebox: "^1.3.6"
  typescript: "^6.0.3"
  vite: "npm:@voidzero-dev/vite-plus-core@0.2.9"
  vite-plus: "0.2.9"
  vitest: "4.1.10"
  ws: "^8.18.3"

catalogs:
  dsh:
    "@deepseek-ai/dsh-agent": &dsh-version "0.1.1-rc.2"
    "@deepseek-ai/dsh-agent-loop": *dsh-version
    "@deepseek-ai/dsh-attachment": *dsh-version
    "@deepseek-ai/dsh-attachment-local": *dsh-version
    "@deepseek-ai/dsh-brand": *dsh-version
    "@deepseek-ai/dsh-code-runtime": *dsh-version
    "@deepseek-ai/dsh-code-runtime-worker-thread": *dsh-version
    "@deepseek-ai/dsh-fs": *dsh-version
    "@deepseek-ai/dsh-invariants": *dsh-version
    "@deepseek-ai/dsh-home-paths": *dsh-version
    "@deepseek-ai/dsh-llm": *dsh-version
    "@deepseek-ai/dsh-sandbox": *dsh-version
    "@deepseek-ai/dsh-sandbox-policy": *dsh-version
    "@deepseek-ai/dsh-scope": *dsh-version
    "@deepseek-ai/dsh-schedule": *dsh-version
    "@deepseek-ai/dsh-session": *dsh-version
    "@deepseek-ai/dsh-session-persistence": *dsh-version
    "@deepseek-ai/dsh-skill": *dsh-version
    "@deepseek-ai/dsh-skill-filesystem": *dsh-version
    "@deepseek-ai/dsh-settings": *dsh-version
    "@deepseek-ai/dsh-shell-env": *dsh-version
    "@deepseek-ai/dsh-subagent": *dsh-version
    "@deepseek-ai/dsh-system-prompt": *dsh-version
    "@deepseek-ai/dsh-timeout": *dsh-version
    "@deepseek-ai/dsh-tool-skill": *dsh-version
    "@deepseek-ai/dsh-tools": *dsh-version
    "@deepseek-ai/dsh-user-approval": *dsh-version
    "@deepseek-ai/dsh-web": *dsh-version

minimumReleaseAgeExclude:
  - "@types/node"
  - "@earendil-works/*"
  - "@deepseek-ai/dsh-*"
  - "@zendev-lab/cue@0.1.2"

overrides:
  "@deepseek-ai/dsh-user-approval": "catalog:dsh"
  # Keep the root Vite Plus peer graph on the variant that pnpm links into
  # node_modules/.bin during clean offline installs used by the container build.
  "@opentelemetry/api": "1.9.0"
  "@connectrpc/connect-node>undici": "8.10.0"
  "@earendil-works/pi-coding-agent>undici": "8.10.0"
  # The MCP SDK's HTTP transport reaches ip-address through express-rate-limit.
  # Keep the patched parser until the SDK refreshes that transitive dependency.
  "express-rate-limit>ip-address": "10.5.0"
  "hono": "4.13.2"
  "@modelcontextprotocol/sdk>@hono/node-server": "2.1.1"
  "@sveltejs/kit>cookie": "0.7.2"
  "miniflare>undici": "8.10.0"
  "postcss": "8.5.26"
  "ajv>fast-uri": "4.1.2"
  "minimatch>brace-expansion": "5.0.9"
  "rc>ini": "7.0.0"
  "typed-rest-client>qs": "6.15.3"
  vite: "catalog:"
  vite-plus: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowedVersions:
    # kysely-codegen 0.20 works with the v13 N-API build; remove this exception
    # once its published peer range includes better-sqlite3 13.
    "kysely-codegen>better-sqlite3": "13"
    typescript: "*"
    vite: "*"
    vitest: "*"
