packages:
  - "apps/*"
  - "packages/*"

# Keep pnpm run/exec read-only while prek temporarily hides unstaged manifests.
verifyDepsBeforeRun: warn

allowBuilds:
  "@google/genai": true
  better-sqlite3: true
  esbuild: true
  koffi: true
  protobufjs: true
  sharp: true
  workerd: true

catalog:
  "@agentclientprotocol/sdk": "1.3.0"
  "@modelcontextprotocol/sdk": "1.30.0"
  "@orpc/client": "1.15.0"
  "@orpc/contract": "1.15.0"
  "@orpc/server": "1.15.0"
  "@stryker-mutator/core": "9.6.1"
  "@stryker-mutator/vitest-runner": "9.6.1"
  "@types/ws": "^8.18.1"
  es-toolkit: "^1.49.0"
  fast-check: "4.9.0"
  "p-retry": "^8.0.0"
  typebox: "^1.3.6"
  typescript: "^6.0.3"
  vite: "npm:@voidzero-dev/vite-plus-core@0.2.8"
  vite-plus: "0.2.8"
  vitest: "4.1.10"
  ws: "^8.18.3"

minimumReleaseAgeExclude:
  - "@types/node"
  - "@earendil-works/*"

overrides:
  "@connectrpc/connect-node>undici": "8.10.0"
  "@earendil-works/pi-coding-agent>undici": "8.10.0"
  # The MCP SDK's HTTP transport reaches ip-address through express-rate-limit.
  # Keep the patched parser until the SDK refreshes that transitive dependency.
  "express-rate-limit>ip-address": "10.4.0"
  "hono": "4.13.1"
  "@modelcontextprotocol/sdk>@hono/node-server": "2.1.0"
  "@sveltejs/kit>cookie": "0.7.2"
  "miniflare>undici": "8.10.0"
  "postcss": "8.5.26"
  "ajv>fast-uri": "3.1.5"
  "minimatch>brace-expansion": "5.0.9"
  "rc>ini": "1.3.8"
  "typed-rest-client>qs": "6.15.3"
  vite: "catalog:"
  vite-plus: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowedVersions:
    typescript: "*"
    vite: "*"
    vitest: "*"
