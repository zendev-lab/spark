packages:
  - "apps/*"
  - "packages/*"

# Keep pnpm run/exec read-only while prek temporarily hides unstaged manifests.
verifyDepsBeforeRun: warn

allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": true
  better-sqlite3: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  sharp: true
  workerd: true

catalog:
  "@zendev-lab/cue": "0.1.2"
  axe-core: "4.13.0"
  "@agentclientprotocol/sdk": "1.3.0"
  "@modelcontextprotocol/sdk": "1.30.0"
  "@optique/core": "1.2.0"
  "@orpc/client": "1.15.0"
  "@orpc/contract": "1.15.0"
  "@orpc/server": "1.15.0"
  "@stryker-mutator/core": "10.0.0"
  "@stryker-mutator/vitest-runner": "10.0.0"
  "@types/ws": "^8.18.1"
  es-toolkit: "^1.49.0"
  fast-check: "4.9.0"
  typebox: "^1.3.6"
  typescript: "^6.0.3"
  vite: "npm:@voidzero-dev/vite-plus-core@0.2.9"
  vite-plus: "0.2.9"
  vitest: "4.1.10"
  ws: "^8.18.3"

catalogs:
  dsh:
    "@deepseek-ai/dsh": &dsh-version "0.1.2-alpha.2"
    "@deepseek-ai/dsh-agent": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-api-session-controller": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-agent-loop": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-attachment": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-attachment-local": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-brand": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-code-runtime": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-code-runtime-worker-thread": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-fs": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-invariants": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-home-paths": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-llm": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-sandbox": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-sandbox-policy": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-scope": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-schedule": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-session": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-session-persistence": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-session-projection": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-skill": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-skill-filesystem": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-settings": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-shell-env": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-subagent": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-system-prompt": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-timeout": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-tool-skill": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-tools": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-typert-protocol": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-util-values": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-user-approval": "0.1.2-alpha.2"
    "@deepseek-ai/dsh-web": "0.1.2-alpha.2"

minimumReleaseAgeExclude:
  - "@types/node"
  - "@earendil-works/*"
  - "@deepseek-ai/dsh-*"
  - "@zendev-lab/cue@0.1.2"
  - "@deepseek-ai/cordis@4.0.2"
  - "@deepseek-ai/cosmokit@1.8.3"
  - "@deepseek-ai/schemastery@3.18.2"
  - "@deepseek-ai/cordis-plugin-group@1.0.2"
  - "@deepseek-ai/cordis-plugin-hmr@1.0.17"
  - "@deepseek-ai/cordis-plugin-include@1.0.7"
  - "@deepseek-ai/cordis-plugin-loader@1.0.3"
  - "@deepseek-ai/cordis-plugin-timer@1.1.4"
  - "@deepseek-ai/dsh@0.1.2-alpha.2"

overrides:
  "@deepseek-ai/dsh-user-approval": "catalog:dsh"
  # Keep the root Vite Plus peer graph on the variant that pnpm links into
  # node_modules/.bin during clean offline installs used by the container build.
  "@opentelemetry/api": "1.9.0"
  "@connectrpc/connect-node>undici": "8.10.0"
  "@earendil-works/pi-coding-agent>undici": "8.10.0"
  # The MCP SDK's HTTP transport reaches ip-address through express-rate-limit.
  # Keep the patched parser until the SDK refreshes that transitive dependency.
  "express-rate-limit>ip-address": "10.5.0"
  "hono": "4.13.2"
  "@modelcontextprotocol/sdk>@hono/node-server": "2.1.1"
  "@sveltejs/kit>cookie": "0.7.2"
  "miniflare>undici": "8.10.0"
  "postcss": "8.5.26"
  "ajv>fast-uri": "4.1.2"
  "minimatch>brace-expansion": "5.0.9"
  "rc>ini": "7.0.0"
  "typed-rest-client>qs": "6.15.3"
  vite: "catalog:"
  vite-plus: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowedVersions:
    # DSH alpha.2 ships React 19 but its renderer's compatibility shim retains
    # the older use-sync-external-store peer declaration.
    "use-sync-external-store>react": "19"
    # kysely-codegen 0.20 works with the v13 N-API build; remove this exception
    # once its published peer range includes better-sqlite3 13.
    "kysely-codegen>better-sqlite3": "13"
    typescript: "*"
    vite: "*"
    vitest: "*"
