[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", stages = ["pre-commit"] },
  { id = "check-case-conflict", stages = ["pre-commit"] },
  { id = "check-executables-have-shebangs", stages = ["pre-commit"] },
  { id = "check-yaml", stages = ["pre-commit"] },
  { id = "check-json", stages = ["pre-commit"] },
  { id = "check-merge-conflict", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "mixed-line-ending", stages = ["pre-commit"] },
  { id = "trailing-whitespace", stages = ["pre-commit"] },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v0.9.20"
hooks = [
  {
    id = "tombi-format",
    exclude = "^Cargo\\.lock$",
    stages = ["pre-commit"]
  },
  {
    id = "tombi-lint",
    args = ["--error-on-warnings"],
    stages = ["pre-commit"]
  },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint", stages = ["pre-commit"] }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.29.0"
hooks = [
  {
    id = "zizmor",
    args = ["--offline", "--strict-collection", "--min-severity=high"],
    files = "^\\.github/(?:workflows/.*\\.ya?ml|actions/.*/action\\.ya?ml)$",
    stages = ["pre-commit"]
  },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.48.0"
hooks = [{ id = "typos", args = ["--force-exclude"], stages = ["pre-commit"] }]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "c4654a7e007c9619a5eb63c39a456572a0fa1851"  # 0.38.0
hooks = [
  {
    id = "check-jsonschema",
    name = "Validate architecture inventory",
    args = [
      "--schemafile",
      "architecture/packages.schema.json",
      "architecture/packages.json"
    ],
    files = "^architecture/packages(?:\\.schema)?\\.json$",
    pass_filenames = false,
    stages = ["pre-commit"]
  },
  {
    id = "check-metaschema",
    name = "Validate architecture schema",
    files = "^architecture/packages\\.schema\\.json$",
    stages = ["pre-commit"]
  },
]

[[repos]]
repo = "https://github.com/zendev-lab/zendev"
rev = "v0.1.0"
hooks = [{ id = "zendev-commit-msg", stages = ["commit-msg"] }]

[[repos]]
repo = "local"
hooks = [
  {
    id = "spark-check-fix",
    name = "Spark static checks --fix",
    entry = "pnpm run fix",
    language = "system",
    pass_filenames = false,
    stages = ["pre-commit"]
  },
]
