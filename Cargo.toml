[workspace]
resolver = "3"
members = ["apps/spark-cli/native", "packages/spark-deployment/native"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
bpaf = { version = "0.9.20", features = ["derive"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
toml = "0.9.5"

[workspace.dependencies.ureq]
version = "3.1.2"
default-features = false
features = ["json", "rustls"]

[profile.release]
opt-level = "z"
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1
